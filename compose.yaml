services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Containerfile
    expose:
      - "8080"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "3000"
    restart: unless-stopped
    depends_on:
      - backend