services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    expose:
      - "8080"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: "http://backend:8080" 
